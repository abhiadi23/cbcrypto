name: Publish cbcrypto to PyPI

on:
  push:
    tags:
      - "v*"            # e.g. git tag v0.5.2 && git push --tags
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,    target: x86_64 }
          - { name: linux-aarch64,  os: ubuntu-latest,    target: aarch64 }
          - { name: windows-x64,    os: windows-latest,   target: x64 }
          - { name: macos-x86_64,   os: macos-13,         target: x86_64 }
          - { name: macos-arm64,    os: macos-latest,     target: aarch64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # abi3-py38 is set in Cargo.toml, so ONE wheel per platform works for Python 3.8+
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          sccache: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing, no token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
