[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "cbcrypto"
version = "0.4.0"
description = "Rust core for cbgram: MTProto crypto and the file download/upload engine"
readme = "Readme.md"
requires-python = ">=3.8"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
features = ["pyo3/extension-module"]
