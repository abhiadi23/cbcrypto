[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "cbcrypto"
version = "0.2.0"
description = "Fast MTProto crypto for cbgram (drop-in for warpcrypto)"
requires-python = ">=3.8"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
features = ["pyo3/extension-module"]
