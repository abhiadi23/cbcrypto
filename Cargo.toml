[package]
name = "cbcrypto"
version = "0.5.0"
edition = "2021"
description = "Rust core for cbgram: MTProto crypto (AES-256-IGE/CTR with AES-NI/VAES/AVX-512, KDF, fused pack/unpack) and the file download/upload engine"
license = "LGPL-3.0-or-later"

[lib]
name = "cbcrypto"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
aes = "0.8"
sha2 = { version = "0.10", features = ["compress"] }
getrandom = "0.2"
socket2 = { version = "0.5", features = ["all"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
# hardware SHA-2 on ARM64 (Termux/Android phones, Apple Silicon, Graviton)
sha2 = { version = "0.10", features = ["compress", "asm"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
